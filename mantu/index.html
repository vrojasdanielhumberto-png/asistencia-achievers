<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro Mantu · Achievers Lab</title>
<meta name="description" content="¿Estás interesado en Mantu? Regístrate acá.">
<meta name="theme-color" content="#0B2654">
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --noche:#0B2654; --morado:#762DA6; --marfil:#FBF9FD; --turquesa:#5CD9DA; --amarillo:#FECE27;
    --texto:#1d2433; --suave:#5b6478; --borde:#d9d3e6; --error:#c0392b; --ok:#1e8e5a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--marfil); color: var(--texto); font: 18px/1.5 "DM Sans", system-ui, sans-serif; }
  h1, h2, h3 { font-family: Poppins, sans-serif; color: var(--noche); line-height: 1.12; margin: 0; text-wrap: balance; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 48px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .top img { width: 34px; }
  .top span { font: 700 16px Poppins, sans-serif; color: var(--noche); }
  .hero { position: relative; overflow: hidden; border-radius: 24px; padding: 26px 22px 24px; color: var(--marfil); background: var(--noche); box-shadow: 0 14px 30px rgba(11,38,84,.25); }
  .hero::before { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: var(--morado); right: -90px; top: -110px; }
  .hero::after { content: ""; position: absolute; width: 64px; height: 64px; border-radius: 50%; background: var(--turquesa); right: 30px; bottom: -24px; }
  .hero > * { position: relative; }
  .chip { display: inline-block; background: var(--amarillo); color: var(--noche); font: 800 13px Poppins, sans-serif; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 5px 12px; }
  .hero h1 { color: var(--marfil); font-size: clamp(32px, 9vw, 44px); font-weight: 800; margin: 12px 0 6px; }
  .hero p { margin: 8px 0 0; font-size: 17.5px; }
  .hero p b { color: var(--amarillo); }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 20px; padding: 22px 18px; margin-top: 18px; }
  h2 { font-size: 25px; margin-bottom: 8px; }
  .sub { color: var(--suave); margin: 0 0 14px; font-size: 17px; }
  label { display: block; font-weight: 700; margin: 10px 0 6px; }
  input[type=text] { width: 100%; font: 19px "DM Sans", sans-serif; padding: 14px 16px; border: 2px solid var(--borde); border-radius: 14px; background: var(--marfil); color: var(--texto); }
  input[type=text]:focus { outline: none; border-color: var(--morado); background: #fff; }
  .mal input { border-color: var(--error); }
  .err { color: var(--error); font-size: 15px; margin-top: 6px; min-height: 1em; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; border: 0; border-radius: 999px; padding: 17px 20px; margin-top: 16px; cursor: pointer; font: 800 18px Poppins, sans-serif; color: #fff; background: var(--morado); box-shadow: 0 6px 0 #521d76; }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #521d76; }
  .btn[disabled] { background: #e7e3ee; color: #9a93a8; box-shadow: none; }
  .estado { text-align: center; color: var(--suave); font-size: 15px; margin-top: 10px; min-height: 1.2em; }
  .quien { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .quien b { font: 800 20px Poppins, sans-serif; color: var(--noche); }
  .enlace { background: none; border: 0; color: var(--morado); font: 700 15px "DM Sans", sans-serif; text-decoration: underline; cursor: pointer; padding: 4px 0; }
  .avance { margin-top: 8px; font-weight: 700; color: var(--morado); }
  .barra { height: 8px; border-radius: 8px; background: #eee8f5; margin-top: 6px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--turquesa); transition: width .3s; }
  .grupo { background: #fff; border: 2px solid var(--borde); border-radius: 18px; padding: 14px 14px 12px; margin-top: 12px; }
  .grupo.hecho { border-color: var(--turquesa); background: #f2fcfc; }
  .gcab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .gcab h3 { font-size: 21px; }
  .gest { font-size: 15px; font-weight: 700; color: var(--suave); }
  .hecho .gest { color: var(--ok); }
  .notas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .medias { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 6px 8.33% 0; }
  .nota { border: 2px solid var(--borde); background: var(--marfil); border-radius: 12px; padding: 10px 0; font: 800 19px Poppins, sans-serif; color: var(--noche); cursor: pointer; min-width: 0; }
  .medias .nota { font-size: 15px; padding: 7px 0; }
  .nota.sel { background: var(--morado); border-color: var(--morado); color: #fff; }
  .nota:disabled { opacity: .6; }
  .oculto { display: none !important; }
  footer { text-align: center; color: var(--suave); font-size: 14px; margin-top: 26px; }
  .ok { text-align:center; padding: 10px 0 4px; }
  .ok .check { width: 72px; height: 72px; border-radius: 50%; background: var(--turquesa); color: var(--noche); font: 800 40px Poppins, sans-serif; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="../logo.png" alt=""><span>Achievers Lab</span></div>
  <section class="hero">
    <span class="chip">Mantu</span>
    <h1>¿Estás interesado en Mantu?</h1>
    <p><b>Regístrate acá</b> con tu nombre completo y tu correo.</p>
  </section>

  <section class="tarjeta" id="p1">
    <h2>Regístrate acá</h2>
    <form id="f" novalidate>
      <div id="cN"><label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" autocomplete="name" maxlength="100" placeholder="Ej.: Laura Gómez">
        <div class="err" id="eN"></div></div>
      <div id="cC"><label for="correo">Correo</label>
        <input type="text" id="correo" inputmode="email" autocomplete="email" autocapitalize="off" maxlength="160" placeholder="tucorreo@ejemplo.com">
        <div class="err" id="eC"></div></div>
      <button class="btn" id="b" type="submit">Registrarme</button>
      <div class="estado" id="s"></div>
    </form>
  </section>

  <section class="tarjeta oculto" id="p2">
    <div class="ok"><div class="check">✓</div><h2>¡Listo, <span id="nom"></span>!</h2>
    <p class="sub">Quedaste registrado. Te escribiremos a <b id="cor"></b>.</p></div>
  </section>

  <footer>Achievers Lab · empresa social y tecnológica fundada en 2024</footer>
</div>
<script>
const URL_ = 'https://uvodcmmehtghkbwadzlq.supabase.co/rest/v1/rpc/mantu_registrar';
const KEY = 'sb_publishable_CLYuajCg_s7EcEQDBkKyNQ__j2Wg_t3';
const $ = id => document.getElementById(id);
function marca(c, e, msg) { $(c).classList.toggle('mal', !!msg); $(e).textContent = msg || ''; }
$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const n = $('nombre').value.trim().replace(/\s+/g, ' '), c = $('correo').value.trim().toLowerCase();
  const okN = n.length >= 3 && n.includes(' '), okC = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c);
  marca('cN', 'eN', okN ? '' : 'Escribe tu nombre y apellido.');
  marca('cC', 'eC', okC ? '' : 'Revisa tu correo.');
  if (!okN || !okC) return;
  $('b').disabled = true; $('s').textContent = 'Guardando…';
  try {
    const r = await fetch(URL_, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_nombre: n, p_correo: c }) });
    if (!r.ok) throw new Error(await r.text());
    $('nom').textContent = n.split(' ')[0]; $('cor').textContent = c;
    $('p1').classList.add('oculto'); $('p2').classList.remove('oculto');
  } catch (e) { $('s').textContent = 'No se guardó. Revisa tu conexión y toca otra vez.'; $('b').disabled = false; }
});
</script>
</body>
</html>
